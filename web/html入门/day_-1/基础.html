<!DOCTYPE html>
<!--声明文档类型 -->
<!-- 这里面注释是这么写的, # 是python里面的-->
<h1>h1:这是一个标题</h1>
<h1>h1:again</h1>
<h2>h2:这是另一个标题,但是明显更小了</h2>
<h3>h3:实际上,HTML标题(Heading)是通过h1-h6标签来定义的</h3>
<h5>h5: h?,?越大,标题越小</h5>
<h6>h6:按了h之后的补全里,也只是到h6</h6>

<h3>HTML中的段落是通过标签<\p>定义的</h3>
<p> \ 依旧权威 这是一个段落</p>
<p> again</p>

<h3>HTML的链接是通过标签 <\a> 来控制的</h3>
<a href="https://www.runoob.com">这是一个链接,其实点了之后真的会过去</a>

<h3>HTML的图像是由标签<\img>来定义的:名称和属性</h3>
<img src="photo/告诉我.png" width="250" height="250" />
