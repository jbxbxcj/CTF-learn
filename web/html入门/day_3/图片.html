<!DOCTYPE html>
<h3>img src=? 显示一张图片</h3>
<p>
    width height 控制图像大小<br>
    <img src="../photo/2.jpg" width="500" height="500">
</p>

<h3>alt参数</h3>
<p>
    <img src="??.png" alt="alt:加载不了图片显示这个东西">
</p>

<h3>title参数</h3>
<p>
    <img src="../photo/1.png" title="title:鼠标放上面显示这个">
    补: style display:none 相当于不显示
</p>
